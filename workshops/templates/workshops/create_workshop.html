<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Workshop | SmartLearn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }
        h1 { color: #243b64; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .back { color: #2563eb; }
        .messages { color: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="{% url 'workshop_list' %}">
            ← Back to Workshops
        </a>

        <h1>Create a Workshop</h1>
        <p>Enter the details to schedule your workshop.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="messages">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Workshop Title *</label>
            <input type="text" name="title" required>

            <label>Instructor Name *</label>
            <input type="text" name="instructor" required>

            <label>Topic</label>
            <input type="text" name="topic" value="General">

            <label>Start Date and Time *</label>
            <input type="datetime-local" name="start_time" required>

            <label>Description</label>
            <textarea name="description" rows="4"></textarea>

            <label>Meeting Link</label>
            <input type="url" name="meeting_url"
                   placeholder="https://...">

            <label>Duration (minutes)</label>
            <input type="number" name="duration_minutes"
                   value="60" min="1" required>

            <label>Maximum Participants</label>
            <input type="number" name="capacity"
                   value="30" min="1" required>

            <label>Price (0 for free)</label>
            <input type="number" name="price"
                   value="0" min="0" step="0.01" required>

            <button type="submit">Create Workshop</button>
        </form>
    </div>
</body>
</html>
