<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop History | SmartLearn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }
        main {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #e8eefc;
        }
    </style>
</head>
<body>
<main>
    <h1>Workshop History</h1>
    <p>View workshop activity and registration records.</p>

    <p><a href="{% url 'workshop_list' %}">← All Workshops</a></p>

    <table>
        <thead>
            <tr>
                <th>Date and Time</th>
                <th>Workshop</th>
                <th>Action</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            {% for item in history %}
            <tr>
                <td>{{ item.created_at }}</td>
                <td>{{ item.workshop_title }}</td>
                <td>{{ item.action }}</td>
                <td>{{ item.details }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No history records found yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>
</body>
</html>
